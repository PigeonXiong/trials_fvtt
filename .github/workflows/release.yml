# 推送 v* 标签（例如 v0.1.0）时：跑测试 → 打包系统 → 发布 GitHub Release。
# Release 附带 system.json 与 trails-of-destiny.zip，
# Foundry 通过 releases/latest/download/system.json 安装与检查更新。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # npm test 用 node --test 的通配写法，需要 Node 21 以上
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test
        run: |
          npm ci
          npm test

      - name: Check version matches tag
        run: |
          VERSION="$(jq -r .version system.json)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "system.json version ($VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Pin download URL to this release
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/trails-of-destiny.zip"
          jq --arg url "$URL" '.download = $url' system.json > system.json.tmp
          mv system.json.tmp system.json

      - name: Package
        run: zip -r trails-of-destiny.zip system.json module templates styles lang README*.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" trails-of-destiny.zip system.json --title "$GITHUB_REF_NAME" --generate-notes
